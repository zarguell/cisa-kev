- cveID: CVE-2026-23760
  vendorProject: SmarterTools
  product: SmarterMail
  vulnerabilityName: SmarterTools SmarterMail Authentication Bypass Using an Alternate
    Path or Channel Vulnerability
  dateAdded: '2026-01-26'
  shortDescription: SmarterTools SmarterMail contains an authentication bypass using
    an alternate path or channel vulnerability in the password reset API. The force-reset-password
    endpoint permits anonymous requests and fails to verify the existing password
    or a reset token when resetting system administrator accounts. This could allow
    an unauthenticated attacker to supply a target administrator username and a new
    password to reset the account, resulting in full administrative compromise of
    the SmarterMail instance.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-02-16'
  knownRansomwareCampaignUse: Unknown
  notes: https://www.smartertools.com/smartermail/release-notes/current ; https://nvd.nist.gov/vuln/detail/CVE-2026-23760
  cwes:
    - CWE-288
