- cveID: CVE-2025-22226
  vendorProject: VMware
  product: ESXi, Workstation, and Fusion
  vulnerabilityName: VMware ESXi, Workstation, and Fusion Information Disclosure Vulnerability
  dateAdded: '2025-03-04'
  shortDescription: VMware ESXi, Workstation, and Fusion contain an information disclosure
    vulnerability due to an out-of-bounds read in HGFS. Successful exploitation allows
    an attacker with administrative privileges to a virtual machine to leak memory
    from the vmx process.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2025-03-25'
