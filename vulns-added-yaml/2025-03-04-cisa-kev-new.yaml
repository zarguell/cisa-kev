  vulnerabilityName: VMware ESXi and Workstation TOCTOU Race Condition Vulnerability
  dateAdded: '2025-03-04'
  shortDescription: VMware ESXi and Workstation contain a time-of-check time-of-use
    (TOCTOU) race condition vulnerability that leads to an out-of-bounds write. Successful
    exploitation enables an attacker with local administrative privileges on a virtual
    machine to execute code as the virtual machine's VMX process running on the host.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
