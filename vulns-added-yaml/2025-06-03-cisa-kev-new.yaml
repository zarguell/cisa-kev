- cveID: CVE-2025-21479
  vendorProject: Qualcomm
  product: Multiple Chipsets
  vulnerabilityName: Qualcomm Multiple Chipsets Incorrect Authorization Vulnerability
  dateAdded: '2025-06-03'
  shortDescription: Multiple Qualcomm chipsets contain an incorrect authorization
    vulnerability. This vulnerability allows for memory corruption due to unauthorized
    command execution in GPU micronode while executing specific sequence of commands.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2025-06-24'
  knownRansomwareCampaignUse: Unknown
  notes: 'Please check with specific vendors (OEMs,) for information on patching status.
    For more information, please see: https://docs.qualcomm.com/product/publicresources/securitybulletin/june-2025-bulletin.html
    ;   https://nvd.nist.gov/vuln/detail/CVE-2025-21479'
  cwes:
    - CWE-863
