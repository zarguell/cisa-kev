- cveID: CVE-2009-0556
  vendorProject: Microsoft
  product: Office
  vulnerabilityName: Microsoft Office PowerPoint Code Injection Vulnerability
  dateAdded: '2026-01-07'
  shortDescription: Microsoft Office PowerPoint contains a code injection vulnerability
    that allows remote attackers to execute arbitrary code via a PowerPoint file with
    an OutlineTextRefAtom containing an invalid index value that triggers memory corruption.
