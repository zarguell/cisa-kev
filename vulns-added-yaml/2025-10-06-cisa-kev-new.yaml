  vendorProject: Microsoft
  product: Windows
  vulnerabilityName: Microsoft Windows Out-of-Bounds Write Vulnerability
  dateAdded: '2025-10-06'
  shortDescription: Microsoft Windows contains a n out-of-bounds write vulnerability
    in the InformationCardSigninHelper Class ActiveX control, icardie.dll. An attacker
    could exploit the vulnerability by constructing a specially crafted webpage. When
    a user views the webpage, the vulnerability could allow remote code execution.
    An attacker who successfully exploited this vulnerability could gain the same
    user rights as the current user. The impacted product could be end-of-life (EoL)
    and/or end-of-service (EoS). Users should discontinue product utilization.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
