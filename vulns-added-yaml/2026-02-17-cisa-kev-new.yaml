- cveID: CVE-2008-0015
  vendorProject: Microsoft
  product: Windows
  vulnerabilityName: ' Microsoft Windows Video ActiveX Control Remote Code Execution
    Vulnerability'
  dateAdded: '2026-02-17'
  shortDescription: Microsoft Windows Video ActiveX Control contains a remote code
    execution vulnerability. An attacker could exploit the vulnerability by constructing
    a specially crafted Web page. When a user views the Web page, the vulnerability
    could allow remote code execution. An attacker who successfully exploited this
    vulnerability could gain the same user rights as the logged-on user.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-03-10'
  knownRansomwareCampaignUse: Unknown
  notes: https://web.archive.org/web/20110305211119/https://www.microsoft.com/technet/security/bulletin/ms09-032.mspx
    ; https://nvd.nist.gov/vuln/detail/CVE-2008-0015
  cwes: []
