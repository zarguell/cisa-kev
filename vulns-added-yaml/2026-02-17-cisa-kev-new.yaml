  product: ThreatSonar Anti-Ransomware
  vulnerabilityName: TeamT5 ThreatSonar Anti-Ransomware Unrestricted Upload of File
    with Dangerous Type Vulnerability
  dateAdded: '2026-02-17'
  shortDescription: TeamT5 ThreatSonar Anti-Ransomware contains an unrestricted upload
    of file with dangerous type vulnerability. ThreatSonar Anti-Ransomware does not
