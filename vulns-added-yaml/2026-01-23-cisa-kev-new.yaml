  product: VMware vCenter Server
  vulnerabilityName: Broadcom VMware vCenter Server Out-of-bounds Write Vulnerability
  dateAdded: '2026-01-23'
  shortDescription: Broadcom VMware vCenter Server contains an out-of-bounds write
    vulnerability in the implementation of the DCERPC protocol. This could allow a
    malicious actor with network access to vCenter Server to send specially crafted
    network packets, potentially leading to remote code execution.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
