    in ANGLE and GPU. This vulnerability could allow a remote attacker to potentially
    perform a sandbox escape via a crafted HTML page. This vulnerability could affect
    multiple web browsers that utilize Chromium, including, but not limited to, Google
    Chrome, Microsoft Edge, and Opera.
