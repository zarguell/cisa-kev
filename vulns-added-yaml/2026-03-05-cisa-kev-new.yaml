- cveID: CVE-2021-22681
  vendorProject: Rockwell
  product: Multiple Products
  vulnerabilityName: Rockwell Multiple Products Insufficient Protected Credentials
    Vulnerability
  dateAdded: '2026-03-05'
  shortDescription: Multiple Rockwell products contain an insufficient protected credentials
    vulnerability. Studio 5000 Logix Designer software may allow a key to be discovered.
    This key is used to verify Logix controllers are communicating with Rockwell Automation
    design software. If successfully exploited, this vulnerability could allow an
    unauthorized application to connect with Logix controllers. To leverage this vulnerability,
    an unauthorized user would require network access to the controller.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-03-26'
  knownRansomwareCampaignUse: Unknown
  notes: https://support.rockwellautomation.com/app/answers/answer_view/a_id/1130301/~/cve-2021-22681%3A-authentication-bypass-vulnerability-found-in-logix-controllers-
