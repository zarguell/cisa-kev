- cveID: CVE-2024-38812
  vendorProject: VMware
  product: vCenter Server
  vulnerabilityName: VMware vCenter Server Heap-Based Buffer Overflow Vulnerability
  dateAdded: '2024-11-20'
  shortDescription: VMware vCenter Server contains a heap-based buffer overflow vulnerability
    in the implementation of the DCERPC protocol. This vulnerability could allow an
    attacker with network access to the vCenter Server to execute remote code by sending
    a specially crafted packet.
  requiredAction: Apply mitigations per vendor instructions or discontinue use of
    the product if mitigations are unavailable.
  dueDate: '2024-12-11'
  knownRansomwareCampaignUse: Unknown
  notes: https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/24968
