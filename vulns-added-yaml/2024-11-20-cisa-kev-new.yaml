- cveID: CVE-2024-38813
  vendorProject: VMware
  product: vCenter Server
  vulnerabilityName: VMware vCenter Server Privilege Escalation Vulnerability
  dateAdded: '2024-11-20'
  shortDescription: VMware vCenter contains an improper check for dropped privileges
    vulnerability. This vulnerability could allow an attacker with network access
    to the vCenter Server to escalate privileges to root by sending a specially crafted
    packet.
  requiredAction: Apply mitigations per vendor instructions or discontinue use of
    the product if mitigations are unavailable.
  dueDate: '2024-12-11'
