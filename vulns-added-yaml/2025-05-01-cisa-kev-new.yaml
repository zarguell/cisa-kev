- cveID: CVE-2024-38475
  vendorProject: Apache
  product: HTTP Server
  vulnerabilityName: Apache HTTP Server Improper Escaping of Output Vulnerability
  dateAdded: '2025-05-01'
  shortDescription: Apache HTTP Server contains an improper escaping of output vulnerability
    in mod_rewrite that allows an attacker to map URLs to filesystem locations that
    are permitted to be served by the server but are not intentionally/directly reachable
    by any URL, resulting in code execution or source code disclosure.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2025-05-22'
  knownRansomwareCampaignUse: Unknown
  notes: 'This vulnerability affects a common open-source component, third-party library,
    or a protocol used by different products. Please check with specific vendors for
    information on patching status. For more information, please see: https://httpd.apache.org/security/vulnerabilities_24.html
    ; https://nvd.nist.gov/vuln/detail/CVE-2024-38475'
  cwes:
    - CWE-116
