- cveID: CVE-2026-20122
  vendorProject: Cisco
  product: Catalyst SD-WAN Manger
  vulnerabilityName: Cisco Catalyst SD-WAN Manager Incorrect Use of Privileged APIs
    Vulnerability
  dateAdded: '2026-04-20'
  shortDescription: Cisco Catalyst SD-WAN Manager contains an incorrect use of privileged
    APIs vulnerability due to improper file handling on the API interface of an affected
    system. An attacker could exploit this vulnerability by uploading a malicious
    file on the local file system. A successful exploit could allow the attacker to
    overwrite arbitrary files on the affected system and gain vmanage user privileges.
  requiredAction: Please adhere to CISA’s guidelines to assess exposure and mitigate
    risks associated with Cisco SD-WAN devices as outlines in CISA’s Emergency Directive
    26-03 (URL listed below in Notes) and CISA’s “Hunt & Hardening Guidance for Cisco
    SD-WAN Devices (URL listed below in Notes). Adhere to the applicable BOD 22-01
    guidance for cloud services or discontinue use of the product if mitigations are
    not available.
  dueDate: '2026-04-23'
  knownRansomwareCampaignUse: Unknown
  notes: 'CISA Mitigation Instructions: https://www.cisa.gov/news-events/directives/ed-26-03-mitigate-vulnerabilities-cisco-sd-wan-systems
    ; https://www.cisa.gov/news-events/directives/supplemental-direction-ed-26-03-hunt-and-hardening-guidance-cisco-sd-wan-systems
    ; https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-authbp-qwCX8D4v
    ; https://nvd.nist.gov/vuln/detail/ CVE-2026-20122'
  cwes:
