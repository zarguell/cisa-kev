- cveID: CVE-2025-58360
  vendorProject: OSGeo
  product: GeoServer
  vulnerabilityName: OSGeo GeoServer Improper Restriction of XML External Entity Reference
    Vulnerability
  dateAdded: '2025-12-11'
  shortDescription: OSGeo GeoServer contains an improper restriction of XML external
    entity reference vulnerability that occurs when the application accepts XML input
    through a specific endpoint /geoserver/wms operation GetMap and could allow an
    attacker to define external entities within the XML request.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-01-01'
  knownRansomwareCampaignUse: Unknown
  notes: 'This vulnerability affects an open-source component, third-party library,
    or a protocol used by different products. For more information, please see: https://github.com/geoserver/geoserver/security/advisories/GHSA-fjf5-xgmq-5525
    ; https://osgeo-org.atlassian.net/browse/GEOS-11922 ; https://nvd.nist.gov/vuln/detail/CVE-2025-58360'
  cwes:
    - CWE-611
