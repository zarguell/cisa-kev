  product: changed-files GitHub Action
  vulnerabilityName: tj-actions/changed-files GitHub Action Embedded Malicious Code
    Vulnerability
  dateAdded: '2025-03-18'
  shortDescription: The tj-actions/changed-files GitHub Action contains an embedded
    malicious code vulnerability that allows a remote attacker to discover secrets
    by reading actions logs. These secrets may include, but are not limited to, valid
    AWS access keys, GitHub personal access tokens (PATs), npm tokens, and private
    RSA keys.
