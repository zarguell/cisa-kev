- cveID: CVE-2016-10033
  vendorProject: PHP
  product: PHPMailer
  vulnerabilityName: PHPMailer Command Injection Vulnerability
  dateAdded: '2025-07-07'
  shortDescription: PHPMailer contains a command injection vulnerability because it
    fails to sanitize user-supplied input. Specifically, this issue affects the 'mail()'
    function of 'class.phpmailer.php' script. An attacker can exploit this issue to
    execute arbitrary code within the context of the application. Failed exploit attempts
    will result in a denial-of-service condition.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2025-07-28'
  knownRansomwareCampaignUse: Unknown
  notes: 'This vulnerability could affect an open-source component, third-party library,
    protocol, or proprietary implementation that could be used by different products.
    For more information, please see: https://github.com/PHPMailer/PHPMailer/releases/tag/v5.2.18
    ; https://github.com/advisories/GHSA-5f37-gxvh-23v6 ; https://nvd.nist.gov/vuln/detail/CVE-2016-10033'
  cwes:
    - CWE-77
    - CWE-88
