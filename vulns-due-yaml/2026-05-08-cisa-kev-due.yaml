  product: DIR-823X
  vulnerabilityName: D-Link DIR-823X Command Injection Vulnerability
  dateAdded: '2026-04-24'
  shortDescription: D-Link DIR-823X contains a command injection vulnerability that
    allows an authorized attacker to execute arbitrary commands on remote devices
    by sending a POST request to /goform/set_prohibiting via the corresponding function.
    The impacted product could be end-of-life (EoL) and/or end-of-service (EoS). Users
    should discontinue product utilization.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-05-08'
  knownRansomwareCampaignUse: Unknown
  notes: https://supportannouncement.us.dlink.com/security/publication.aspx?name=SAP10469
    ; https://nvd.nist.gov/vuln/detail/CVE-2025-29635
  cwes:
    - CWE-77
