- cveID: CVE-2026-8037
  vendorProject: Progress
  product: LoadMaster
  vulnerabilityName: Progress LoadMaster Command Injection Vulnerability
  dateAdded: '2026-08-07'
  shortDescription: Progress LoadMaster contains a command injection vulnerability
    that allows an un-authenticated attacker to execute arbitrary commands on the
    LoadMaster appliance by exploiting unsanitized input in multiple command endpoints.
  requiredAction: Apply mitigations in accordance with vendor instructions, ensuring
    compliance with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see
    URL in Notes) guidance and CISA’s “Forensics Triage Requirements” (see URL in
    Notes). Follow applicable BOD 26-04 guidance for cloud services or discontinue
    use of the product if mitigations are unavailable. Stakeholders are responsible
    for evaluating each asset's internet exposure and ensuring adherence to BOD 26-04
    patching guidelines.
  dueDate: '2026-08-10'
  knownRansomwareCampaignUse: Unknown
  notes: 'https://community.progress.com/s/article/LoadMaster-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691
