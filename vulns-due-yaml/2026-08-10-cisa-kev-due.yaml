    ; Forensics Triage Requirements: https://www.cisa.gov/news-events/directives/bod-26-04-implementation-guidance-prioritizing-security-updates-based-risk
    ; https://nvd.nist.gov/vuln/detail/CVE-2026-8037'
  cwes:
    - CWE-77
- cveID: CVE-2025-68686
  vendorProject: Fortinet
  product: FortiOS
  vulnerabilityName: Fortinet FortiOS Exposure of Sensitive Information to an Unauthorized
    Actor Vulnerability
  dateAdded: '2026-07-27'
  shortDescription: Fortinet FortiOS contains an exposure of sensitive information
    to an unauthorized actor vulnerability. This may allow a remote unauthenticated
    attacker to bypass the patch developed for the symbolic link persistency mechanism
    observed in some post-exploit cases, via crafted HTTP requests. An attacker would
    need first to have compromised the product via another vulnerability, at filesystem
    level.
  requiredAction: Apply mitigations in accordance with vendor instructions, ensuring
    compliance with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see
    URL in Notes) guidance and CISA’s “Forensics Triage Requirements” (see URL in
    Notes). Follow applicable BOD 26-04 guidance for cloud services or discontinue
    use of the product if mitigations are unavailable. Stakeholders are responsible
    for evaluating each asset's internet exposure and ensuring adherence to BOD 26-04
    patching guidelines.
  dueDate: '2026-08-10'
  knownRansomwareCampaignUse: Unknown
  notes: 'https://fortiguard.fortinet.com/psirt/FG-IR-25-934 ; BOD 26-04: https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
