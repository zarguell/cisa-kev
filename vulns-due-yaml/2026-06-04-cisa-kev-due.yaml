- cveID: CVE-2025-34291
  vendorProject: Langflow
  product: Langflow
  vulnerabilityName: Langflow Origin Validation Error Vulnerability
  dateAdded: '2026-05-21'
  shortDescription: Langflow contains an origin validation error vulnerability in
    which an overly permissive CORS configuration combined with a refresh token cookie
    configured as SameSite=None allows a malicious webpage to perform cross-origin
    requests that include credentials and successfully call the refresh endpoint.
    This could allow the attacker to execute arbitrary code and achieve full system
    compromise via obtained tokens that permit access to authenticated endpoints.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2026-06-04'
  knownRansomwareCampaignUse: Unknown
  notes: 'This vulnerability could affect an open-source component, third-party library,
    protocol, or proprietary implementation that could be used by different products.
    For more information, please see: https://github.com/langflow-ai/langflow ; https://github.com/langflow-ai/langflow/releases/tag/v1.9.3;
    https://github.com/langflow-ai/langflow/issues/11465#event-25774545848 ; https://nvd.nist.gov/vuln/detail/CVE-2025-34291'
  cwes:
    - CWE-346
