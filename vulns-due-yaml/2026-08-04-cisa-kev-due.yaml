- cveID: CVE-2026-60137
  vendorProject: WordPress
  product: Core
  vulnerabilityName: WordPress Core SQL Injection Vulnerability
  dateAdded: '2026-07-21'
  shortDescription: WordPress Core contains a SQL injection vulnerability when a plugin
    or theme passes untrusted input to the parameter. This vulnerability can be chained
    with CVE-2026-63030 to allow an unauthenticated attacker to gain remote code execution
    on default WordPress installations.
  requiredAction: Apply mitigations in accordance with vendor instructions, ensuring
    compliance with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see
    URL in Notes) guidance and CISA’s “Forensics Triage Requirements” (see URL in
    Notes). Follow applicable BOD 26-04 guidance for cloud services or discontinue
    use of the product if mitigations are unavailable. Stakeholders are responsible
    for evaluating each asset's internet exposure and ensuring adherence to BOD 26-04
    patching guidelines.
  dueDate: '2026-08-04'
  knownRansomwareCampaignUse: Unknown
  notes: 'https://wordpress.org/news/2026/07/wordpress-7-0-2-release/ ; BOD 26-04:
    https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
    ; Forensics Triage Requirements: https://www.cisa.gov/news-events/directives/bod-26-04-implementation-guidance-prioritizing-security-updates-based-risk
    ; https://nvd.nist.gov/vuln/detail/CVE-2026-60137'
  cwes:
    - CWE-89
