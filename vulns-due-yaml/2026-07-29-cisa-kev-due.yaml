  dateAdded: '2026-07-15'
  shortDescription: 'KNX Association KNX Protocol Connection Authorization Option
    1 contains an overly restrictive account lockout mechanism vulnerability that
    could allow an attacker to purge all devices without additional security options
    enabled and set a BCU key to lock the device. '
