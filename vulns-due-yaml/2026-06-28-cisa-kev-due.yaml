  vulnerabilityName: Cisco Unified Communications Manager Server-Side Request Forgery
    (SSRF) Vulnerability
  dateAdded: '2026-06-25'
  shortDescription: Cisco Unified Communications Manager (Unified CM) and Cisco Unified
    Communications Manager Session Management Edition (Unified CM SME) contain a server-side
    request forgery (SSRF) Vulnerability that could allow an unauthenticated, remote
    attacker to write files to the underlying operating system that could be used
    later to elevate to root.
