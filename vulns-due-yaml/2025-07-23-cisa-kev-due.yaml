- cveID: CVE-2025-49704
  vendorProject: Microsoft
  product: SharePoint
  vulnerabilityName: Microsoft SharePoint Code Injection Vulnerability
  dateAdded: '2025-07-22'
  shortDescription: Microsoft SharePoint contains a code injection vulnerability that
    could allow an authorized attacker to execute code over a network. This vulnerability
    could be chained with CVE-2025-49706. The update for CVE-2025-53770 includes more
    robust protections than the update for CVE-2025-49704.
  requiredAction: CISA recommends disconnecting public-facing versions of SharePoint
    Server that have reached their end-of-life (EOL) or end-of-service (EOS). For
    example, SharePoint Server 2013 and earlier versions are end-of-life and should
    be discontinued if still in use. For supported versions, please follow the mitigations
    according to CISA and vendor instructions. Adhere to the applicable BOD 22-01
    guidance for cloud services or discontinue use of the product if mitigations are
    not available.
  dueDate: '2025-07-23'
  knownRansomwareCampaignUse: Unknown
  notes: 'CISA Mitigation Instructions: https://www.cisa.gov/news-events/alerts/2025/07/20/microsoft-releases-guidance-exploitation-sharepoint-vulnerability-cve-2025-53770;
    https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
    ; https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-49704 ; https://nvd.nist.gov/vuln/detail/CVE-2025-49704'
  cwes:
    - CWE-94
- cveID: CVE-2025-49706
  vendorProject: Microsoft
  product: SharePoint
  vulnerabilityName: Microsoft SharePoint Improper Authentication Vulnerability
  dateAdded: '2025-07-22'
  shortDescription: Microsoft SharePoint contains an improper authentication vulnerability
    that allows an authorized attacker to perform spoofing over a network. Successfully
    exploitation could allow an attacker to view sensitive information and make some
    changes to disclosed information. This vulnerability could be chained with CVE-2025-49704.
    The update for CVE-2025-53771 includes more robust protections than the update
    for CVE-2025-49706.
  requiredAction: CISA recommends disconnecting public-facing versions of SharePoint
    Server that have reached their end-of-life (EOL) or end-of-service (EOS). For
    example, SharePoint Server 2013 and earlier versions are end-of-life and should
    be discontinued if still in use. For supported versions, please follow the mitigations
    according to CISA and vendor instructions. Adhere to the applicable BOD 22-01
    guidance for cloud services or discontinue use of the product if mitigations are
    not available.
  dueDate: '2025-07-23'
  knownRansomwareCampaignUse: Unknown
  notes: 'CISA Mitigation Instructions: https://www.cisa.gov/news-events/alerts/2025/07/20/microsoft-releases-guidance-exploitation-sharepoint-vulnerability-cve-2025-53770;
    https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
    ; https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-49706 ; https://nvd.nist.gov/vuln/detail/CVE-2025-49706'
  cwes:
    - CWE-287
- cveID: CVE-2025-6554
  vendorProject: Google
  product: Chromium V8
  vulnerabilityName: Google Chromium V8 Type Confusion Vulnerability
  dateAdded: '2025-07-02'
  shortDescription: Google Chromium V8 contains a type confusion vulnerability that
    could allow a remote attacker to perform arbitrary read/write via a crafted HTML
    page. This vulnerability could affect multiple web browsers that utilize Chromium,
    including, but not limited to, Google Chrome, Microsoft Edge, and Opera.
  requiredAction: Apply mitigations per vendor instructions, follow applicable BOD
    22-01 guidance for cloud services, or discontinue use of the product if mitigations
    are unavailable.
  dueDate: '2025-07-23'
  knownRansomwareCampaignUse: Unknown
  notes: https://chromereleases.googleblog.com/2025/06/stable-channel-update-for-desktop_30.html?m=1
    ; https://nvd.nist.gov/vuln/detail/CVE-2025-6554
  cwes:
    - CWE-843
