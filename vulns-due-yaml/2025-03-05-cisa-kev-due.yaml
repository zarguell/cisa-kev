  requiredAction: Apply mitigations per vendor instructions or discontinue use of
    the product if mitigations are unavailable.
  dueDate: '2025-03-05'
  knownRansomwareCampaignUse: Unknown
  notes: https://www.mitel.com/-/media/mitel/file/pdf/support/security-advisories/security-bulletin_24-0019-001-v2.pdf
    ; https://nvd.nist.gov/vuln/detail/CVE-2024-41710
  cwes:
    - CWE-88
