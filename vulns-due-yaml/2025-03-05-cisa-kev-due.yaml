- cveID: CVE-2024-41710
  vendorProject: Mitel
  product: SIP Phones
  vulnerabilityName: Mitel SIP Phones Argument Injection Vulnerability
  dateAdded: '2025-02-12'
  shortDescription: Mitel 6800 Series, 6900 Series, and 6900w Series SIP Phones, including
    the 6970 Conference Unit, contain an argument injection vulnerability due to insufficient
    parameter sanitization during the boot process. Successful exploitation may allow
