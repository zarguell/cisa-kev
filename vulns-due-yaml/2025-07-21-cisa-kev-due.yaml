- cveID: CVE-2025-53770
  vendorProject: Microsoft
  product: SharePoint
  vulnerabilityName: Microsoft SharePoint Deserialization of Untrusted Data Vulnerability
  dateAdded: '2025-07-20'
  shortDescription: Microsoft SharePoint Server on-premises contains a deserialization
    of untrusted data vulnerability that could allow an unauthorized attacker to execute
    code over a network.
  requiredAction: 'CISA recommends configuring AMSI integration in SharePoint and
    deploying Defender AV on all SharePoint servers. If AMSI cannot be enabled, CISA
    recommends disconnecting affected products that are public-facing on the internet
    from service until official mitigations are available. Once mitigations are provided,
    apply them according to CISA and vendor instructions. Follow the applicable BOD
    22-01 guidance for cloud services or discontinue use of the product if mitigations
    are not available.  '
  dueDate: '2025-07-21'
  knownRansomwareCampaignUse: Unknown
  notes: 'CISA Mitigation Instructions: https://www.cisa.gov/news-events/alerts/2025/07/20/microsoft-releases-guidance-exploitation-sharepoint-vulnerability-cve-2025-53770
    ; https://msrc.microsoft.com/blog/2025/07/customer-guidance-for-sharepoint-vulnerability-cve-2025-53770/
    ; https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-53770 ; https://nvd.nist.gov/vuln/detail/CVE-2025-53770'
  cwes:
    - CWE-502
