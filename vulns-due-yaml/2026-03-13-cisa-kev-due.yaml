  vulnerabilityName: RoundCube Webmail Deserialization of Untrusted Data Vulnerability
  dateAdded: '2026-02-20'
  shortDescription: RoundCube Webmail contains a deserialization of untrusted data
    vulnerability that allows remote code execution by authenticated users because
    the _from parameter in a URL is not validated in program/actions/settings/upload.php.
