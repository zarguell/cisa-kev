- cveID: CVE-2026-46817
  vendorProject: Oracle
  product: E-Business Suite
  vulnerabilityName: Oracle E-Business Suite Improper Privilege Management Vulnerability
  dateAdded: '2026-07-15'
  shortDescription: Oracle E-Business Suite contains an improper privilege management
    vulnerability that allows an unauthenticated attacker with network access via
    HTTP to compromise Oracle Payments. Successful attacks of this vulnerability can
    result in takeover of Oracle Payments.
  requiredAction: Apply mitigations in accordance with vendor instructions, ensuring
    compliance with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see
    URL in Notes) guidance and CISA’s “Forensics Triage Requirements” (see URL in
    Notes). Follow applicable BOD 26-04 guidance for cloud services or discontinue
    use of the product if mitigations are unavailable. Stakeholders are responsible
    for evaluating each asset's internet exposure and ensuring adherence to BOD 26-04
    patching guidelines.
  dueDate: '2026-07-18'
  knownRansomwareCampaignUse: Unknown
  notes: 'https://www.oracle.com/security-alerts/cspumay2026.html ; BOD 26-04: https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
    ; Forensics Triage Requirements: https://www.cisa.gov/news-events/directives/bod-26-04-implementation-guidance-prioritizing-security-updates-based-risk
    ; https://nvd.nist.gov/vuln/detail/CVE-2026-46817'
  cwes:
